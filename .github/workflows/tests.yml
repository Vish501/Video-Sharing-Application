name: Run Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-anyio pytest-cov asgi-lifespan

      - name: Set environment variables for tests
        run: |
          echo "ENV=test" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite+aiosqlite:///./test.db" >> $GITHUB_ENV
          echo "JWT_SECRET_TOKEN=test-secret" >> $GITHUB_ENV
          echo "IMAGEKIT_PUBLIC_KEY=fake" >> $GITHUB_ENV
          echo "IMAGEKIT_PRIVATE_KEY=fake" >> $GITHUB_ENV
          echo "IMAGEKIT_URL_ENDPOINT=fake" >> $GITHUB_ENV

      - name: Run pytest
        run: pytest -v --maxfail=1
