# NOTE:
# This project currently uses pytest.ini for test configuration.
# In the future, this may be migrated to pyproject.toml under
# [tool.pytest.ini_options] as the project tooling matures and
# the stack stabilizes.

[pytest]
# Automatically detect and run async tests (pytest-asyncio)
asyncio_mode = auto

# Directory where tests are located
testpaths = tests

# addopts:
# -ra : show extra summary info for skipped, xfailed, xpassed tests
# -q  : quiet output to reduce noise (useful in CI)
# -v  : show verbosity by displaying name and outcome of each test on a new line
addopts = 
    -ra
    -v
    --strict-markers
    --cov=VideoSharingApp
    --cov-report=term-missing
