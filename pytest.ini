# NOTE:
# This project currently uses pytest.ini for test configuration.
# In the future, this may be migrated to pyproject.toml under
# [tool.pytest.ini_options] as the project tooling matures and
# the stack stabilizes.

[pytest]
# Automatically detect and run async tests (pytest-asyncio)
asyncio_mode = auto

# Directory where all test modules and files are located
testpaths = tests

# addopts:
# -ra : show extra summary info for skipped, xfailed, xpassed tests
# -q  : quiet output to reduce noise (useful in CI)
# -v  : show verbosity by displaying name and outcome of each test on a new line
# --strict-markers : fail on unknown markers
# --cov : enable coverage tracking
# --cov-report=term-missing : show uncovered lines
addopts = 
    -ra
    -v
    --strict-markers
    --cov=VideoSharingApp
    --cov-report=term-missing

# Environment variables injected during pytest execution
# These override application defaults to ensure:
# - isolated test stage
# - no console logging noise during CI
env =
    STAGE=test
    LOG_CONSOLE_ENABLED=false
    